<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maodie 管理面板</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f8fb;
            --surface: #ffffff;
            --surface-soft: #eef2f7;
            --text: #151923;
            --muted: #5f6876;
            --primary: #1769e0;
            --primary-soft: #d9e7ff;
            --border: #dce2ea;
            --shadow: 0 8px 24px rgba(23, 33, 54, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #101318;
                --surface: #191d24;
                --surface-soft: #232934;
                --text: #eef1f6;
                --muted: #aab2bf;
                --primary: #8db8ff;
                --primary-soft: #223654;
                --border: #313845;
                --shadow: none;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .topbar {
            padding: 8px 4px;
            font-size: 22px;
            font-weight: 700;
        }

        .card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .icon {
            width: 24px;
            height: 24px;
            flex: 0 0 24px;
            color: var(--primary);
        }

        .card-desc {
            margin-bottom: 16px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row > * { flex: 1; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .field label {
            color: var(--muted);
            font-size: 13px;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-soft);
            color: var(--text);
            padding: 0 12px;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.18);
        }

        button {
            min-height: 44px;
            border: 0;
            border-radius: 10px;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font: inherit;
            font-weight: 650;
        }

        button.filled {
            background: var(--primary);
            color: #fff;
        }

        button.icon-button {
            flex: 0 0 44px;
            width: 44px;
            padding: 0;
        }

        button:disabled {
            opacity: 0.62;
        }

        button:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        button.loading::after {
            content: "";
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .history-card {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface-soft);
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .history-head h3 {
            margin: 0;
            font-size: 16px;
        }

        .log-box {
            max-height: 220px;
            overflow-y: auto;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 20px;
            z-index: 10;
            max-width: 620px;
            margin: 0 auto;
            padding: 12px 14px;
            border-radius: 12px;
            background: #242a33;
            color: #fff;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.26);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 420px) {
            .row { flex-direction: column; }
            .row .icon-button { align-self: flex-end; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="topbar">Maodie 控制中心</h1>

        <section class="card">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Z"/></svg>
                <h3>DNS 解析路由</h3>
            </div>
            <div class="card-desc">
                一键切换底层 DNS 接管模式。首次使用若 DoH 无法联通，可先点「首次配置」切到纯 IP DNS 启动；搭配 AdGuard Home 模块使用时，请切换至「AGH 伴生模式」。
            </div>
            <div class="stack">
                <button id="btnDnsFirstTime" type="button">首次配置（纯 IP DNS）</button>
                <div class="row">
                    <button id="btnDnsDefault" type="button">默认 DNS</button>
                    <button id="btnDnsAGH" type="button">AGH 伴生</button>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96ZM14 13v4h-4v-4H7l5-5 5 5h-3Z"/></svg>
                <h3>订阅节点配置</h3>
            </div>
            <div class="card-desc">修改后将自动重启内核生效。留空则保持原链接不变。</div>

            <div class="field">
                <label for="url1">Provider 1 订阅地址</label>
                <input id="url1" autocomplete="off">
            </div>
            <div class="field">
                <label for="url2">Provider 2 订阅地址</label>
                <input id="url2" autocomplete="off">
            </div>
            <div class="field">
                <label for="url3">Provider 3 订阅地址</label>
                <input id="url3" autocomplete="off">
            </div>

            <div class="row" style="margin-top: 16px;">
                <button id="saveBtn" type="button">保存并重启</button>
                <button id="refreshBtn" class="icon-button" type="button" title="刷新页面" aria-label="刷新页面">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8S7.58 20 12 20c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
                </button>
            </div>
        </section>

        <section class="history-card">
            <div class="history-head">
                <h3>修改记录</h3>
                <button id="clearLogBtn" class="icon-button" type="button" title="清空记录" aria-label="清空记录">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1ZM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7Z"/></svg>
                </button>
            </div>
            <div id="logBox" class="log-box">正在加载...</div>
        </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const exec = (command, options = {}) => new Promise((resolve, reject) => {
            if (!window.ksu || typeof window.ksu.exec !== 'function') {
                reject(new Error('KernelSU WebUI bridge is unavailable'));
                return;
            }

            const callbackName = `ksuExecCallback_${Date.now()}_${Math.random().toString(16).slice(2)}`;
            const timer = setTimeout(() => {
                delete window[callbackName];
                reject(new Error('操作超时，请稍后重试'));
            }, 30000);
            window[callbackName] = (errno, stdout, stderr) => {
                clearTimeout(timer);
                delete window[callbackName];
                resolve({ errno, stdout: stdout || '', stderr: stderr || '' });
            };
            window.ksu.exec(command, JSON.stringify(options), callbackName);
        });

        const CONFIG_FILE = '/data/adb/modules/Maodie-Launcher/maodie/config/config.yaml';
        const LOG_FILE = '/data/adb/modules/Maodie-Launcher/webroot/history.log';
        const CORE_SCRIPT = '/data/adb/modules/Maodie-Launcher/maodie/scripts/core.sh';
        const CONFIG_SCRIPT = '/data/adb/modules/Maodie-Launcher/maodie/scripts/configctl.sh';

        const execChecked = async (command, options = {}) => {
            const result = await exec(command, options);
            if (result.errno !== 0) {
                throw new Error(result.stderr.trim() || `命令执行失败 (${result.errno})`);
            }
            return result;
        };

        const restartKernel = () => execChecked(`sh ${CORE_SCRIPT} restart`);

        const $ = (id) => document.getElementById(id);
        const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
        const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

        let toastTimer;
        const snackbar = (message) => {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
        };

        const setLoading = (btn, loading) => {
            btn.disabled = loading;
            btn.setAttribute('aria-busy', String(loading));
            btn.classList.toggle('loading', loading);
        };

        const setFilled = (btn, filled) => {
            btn.classList.toggle('filled', filled);
            btn.setAttribute('aria-pressed', String(filled));
        };

        const DNS_DEFAULT = `dns:
  enable: true
  ipv6: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  respect-rules: true
  fake-ip-filter:
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:google_fcm"
    - "+.lan"
    - "+.local"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
      - 223.5.5.5
      - 119.29.29.29`;

        const DNS_FIRSTTIME = `dns:
  enable: true
  ipv6: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  respect-rules: true
  fake-ip-filter:
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:google_fcm"
    - "+.lan"
    - "+.local"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
      - 223.5.5.5
      - 119.29.29.29`;

        const DNS_AGH = `dns:
  enable: true
  ipv6: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  respect-rules: true
  fake-ip-filter:
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:google_fcm"
    - "+.lan"
    - "+.local"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - 223.5.5.5
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
      - 127.0.0.1:5591`;

        const fetchConfigText = async () => {
            const { errno, stdout } = await exec(`cat ${CONFIG_FILE} | base64 -w 0`);
            return (errno === 0 && stdout) ? b64_to_utf8(stdout.trim()) : "";
        };

        const saveConfigText = async (text) => {
            const b64Str = utf8_to_b64(text);
            await execChecked(`sh ${CONFIG_SCRIPT} apply-base64 "${b64Str}"`);
        };

        const applyDnsState = (configText) => {
            const btnDefault = $('btnDnsDefault');
            const btnAGH = $('btnDnsAGH');
            const btnFirst = $('btnDnsFirstTime');

            setFilled(btnDefault, false);
            setFilled(btnAGH, false);
            setFilled(btnFirst, false);

            if (!configText) return;

            if (configText.includes("127.0.0.1:5591")) {
                setFilled(btnAGH, true);
                return;
            }

            const m = configText.match(/^\s{2}nameserver:\s*\n((?:\s{4,}-.*\n?)+)/m);
            if (m && !/https?:\/\//i.test(m[1])) {
                setFilled(btnFirst, true);
            } else {
                setFilled(btnDefault, true);
            }
        };

        const checkDnsState = async () => {
            applyDnsState(await fetchConfigText());
        };

        const appendHistory = async (message) => {
            const time = new Date().toLocaleString();
            const b64Log = utf8_to_b64(`[${time}] ${message}\n`);
            await exec(`echo -n "${b64Log}" | base64 -d >> ${LOG_FILE}`);
        };

        const loadHistory = async () => {
            const { errno, stdout } = await exec(`cat ${LOG_FILE}`);
            const logBox = $('logBox');
            if (errno === 0 && stdout.trim()) {
                logBox.textContent = stdout;
                logBox.scrollTop = logBox.scrollHeight;
            } else {
                logBox.textContent = "暂无修改记录...";
            }
        };

        const switchDns = async (mode) => {
            let configText = await fetchConfigText();
            if (!configText) {
                snackbar("错误：无法读取配置文件");
                return;
            }

            const newBlock = mode === 'agh' ? DNS_AGH
                : mode === 'firsttime' ? DNS_FIRSTTIME
                : DNS_DEFAULT;
            const modeLabel = mode === 'agh' ? 'AGH伴生'
                : mode === 'firsttime' ? '首次配置'
                : '默认';
            const lines = configText.split(/\r?\n/);
            const newLines = [];
            let inDnsBlock = false;
            let dnsInserted = false;

            for (const line of lines) {
                if (line === 'dns:' || line.startsWith('dns: ')) {
                    inDnsBlock = true;
                    if (!dnsInserted) {
                        newLines.push(newBlock);
                        dnsInserted = true;
                    }
                    continue;
                }

                if (inDnsBlock) {
                    if (line.trim() === '' || /^[ \t]+/.test(line)) continue;
                    inDnsBlock = false;
                    newLines.push(line);
                    continue;
                }
                newLines.push(line);
            }

            if (!dnsInserted) {
                if (newLines.length > 0 && newLines[newLines.length - 1].trim() !== '') newLines.push('');
                newLines.push(newBlock);
            }

            await saveConfigText(newLines.join('\n'));
            await appendHistory(`DNS切换: 成功变更为 ${modeLabel} 模式`);
            await restartKernel();
            snackbar("DNS已切换，内核自动重启中");
            await checkDnsState();
            await loadHistory();
        };

        const getProviderUrl = (text, provider) => {
            const regex = new RegExp(`(^[ \\t]*${provider}:[\\s\\S]*?^[ \\t]*url:[ \\t]*)(.*)$`, 'm');
            const match = text.match(regex);
            if (!match) return '';
            return match[2].trim().split('#')[0].trim().replace(/^["']|["']$/g, '');
        };

        const updateProviderUrl = (text, provider, newUrl) => {
            const regex = new RegExp(`(^[ \\t]*${provider}:[\\s\\S]*?^[ \\t]*url:[ \\t]*)(.*)$`, 'm');
            return regex.test(text) ? text.replace(regex, `$1${JSON.stringify(newUrl)}`) : text;
        };

        const applyConfigText = (text) => {
            $('url1').value = getProviderUrl(text, 'provider1');
            $('url2').value = getProviderUrl(text, 'provider2');
            $('url3').value = getProviderUrl(text, 'provider3');
        };

        const loadConfig = async () => {
            applyConfigText(await fetchConfigText());
        };

        const loadPageState = async () => {
            const [configText] = await Promise.all([fetchConfigText(), loadHistory()]);
            applyConfigText(configText);
            applyDnsState(configText);
        };

        const runAction = async (btn, action) => {
            setLoading(btn, true);
            try {
                await action();
            } catch (error) {
                snackbar(error.message || "操作失败");
            } finally {
                setLoading(btn, false);
            }
        };

        $('btnDnsFirstTime').addEventListener('click', () => {
            const btn = $('btnDnsFirstTime');
            runAction(btn, () => switchDns('firsttime'));
        });

        $('btnDnsDefault').addEventListener('click', () => {
            const btn = $('btnDnsDefault');
            runAction(btn, () => switchDns('default'));
        });

        $('btnDnsAGH').addEventListener('click', () => {
            const btn = $('btnDnsAGH');
            runAction(btn, () => switchDns('agh'));
        });

        $('saveBtn').addEventListener('click', () => {
            const btn = $('saveBtn');
            runAction(btn, async () => {
                let configText = await fetchConfigText();
                if (!configText) {
                    snackbar("错误：无法读取配置文件");
                    return;
                }

                const urls = {
                    provider1: $('url1').value.trim(),
                    provider2: $('url2').value.trim(),
                    provider3: $('url3').value.trim()
                };
                let updatedCount = 0;

                for (const [provider, url] of Object.entries(urls)) {
                    if (!url) continue;
                    if (!/^https?:\/\/[^\s"\\]+$/i.test(url)) {
                        throw new Error(`${provider} 仅支持有效的 HTTP/HTTPS 地址`);
                    }
                    const oldUrl = getProviderUrl(configText, provider);
                    if (oldUrl === url) continue;
                    configText = updateProviderUrl(configText, provider, url);
                    await appendHistory(`更新 ${provider}: 成功`);
                    updatedCount++;
                }

                if (updatedCount > 0) {
                    await saveConfigText(configText);
                    await appendHistory(`执行内核重启`);
                    await restartKernel();
                    snackbar("保存成功，内核已重启");
                } else {
                    snackbar("未检测到链接变更");
                }
                await loadHistory();
            });
        });

        $('refreshBtn').addEventListener('click', () => {
            const btn = $('refreshBtn');
            runAction(btn, async () => {
                await loadPageState();
                snackbar("数据已刷新");
            });
        });

        $('clearLogBtn').addEventListener('click', () => {
            const btn = $('clearLogBtn');
            runAction(btn, async () => {
                await execChecked(`rm -f ${LOG_FILE}`);
                await loadHistory();
                snackbar("记录已清空");
            });
        });

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadPageState();
            } catch (error) {
                snackbar(error.message || "页面初始化失败");
            }
        });
    </script>
</body>
</html>
