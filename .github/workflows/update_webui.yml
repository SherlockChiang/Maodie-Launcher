name: Auto Update MetaCubeXD & Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest MetaCubeXD
        run: |
          echo "正在检查 MetaCubeXD 最新版本..."
          
          LATEST_DATA=$(curl -s https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest)
          
          # 1. 提取版本号
          VERSION=$(echo "$LATEST_DATA" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "发现最新版本: $VERSION"
          
          # 2. 【核心修复】更精准的提取方式，避免前面的空格
          # 使用 cut -d '"' -f 4 直接取双引号里的内容
          DOWNLOAD_URL=$(echo "$LATEST_DATA" | grep 'browser_download_url' | grep 'compressed-dist.tgz' | cut -d '"' -f 4)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ 错误: 未找到 compressed-dist.tgz 下载链接！"
            exit 1
          fi
          
          echo "下载地址: $DOWNLOAD_URL"
          
          # 3. 下载 (使用 xargs 去除可能的残留空白符，双重保险)
          echo "$DOWNLOAD_URL" | xargs wget -O webui.tgz
          
          mkdir -p temp_webui
          tar -xzvf webui.tgz -C temp_webui
          
          echo "ui_version=$VERSION" >> $GITHUB_ENV

      - name: Replace WebUI Files
        run: |
          TARGET_DIR="maodie/config/webui"
          mkdir -p "$TARGET_DIR"
          rm -rf "$TARGET_DIR"/*
          cp -r temp_webui/* "$TARGET_DIR"/
          rm -rf temp_webui webui.tgz
          echo "✅ WebUI 文件替换完成"

      - name: Check for Changes and Commit
        id: git_check
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add maodie/config/webui/
          
          if git diff --staged --quiet; then
            echo "WebUI 内容未发生变化，跳过发布。"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "检测到新内容，正在提交..."
            git commit -m "chore: auto update MetaCubeXD to ${{ env.ui_version }}"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Zip Module
        if: steps.git_check.outputs.updated == 'true'
        run: |
          mkdir -p maodie/run
          zip -r Maodie-Launcher-${{ env.ui_version }}.zip META-INF maodie customize.sh module.prop service.sh uninstall.sh

      - name: Create Release
        if: steps.git_check.outputs.updated == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.ui_version }}-webui
          name: Auto Update WebUI ${{ env.ui_version }}
          body: |
            🤖 自动同步 MetaCubeXD 面板至版本 **${{ env.ui_version }}**
            
            此版本包含最新的 WebUI 文件。
          draft: false
          prerelease: false
          files: Maodie-Launcher-${{ env.ui_version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}