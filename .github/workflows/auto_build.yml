name: Build and Release Module

# 触发条件配置
on:
  # 1. 当推送到 main 分支时触发
  push:
    branches: [ "main" ]
    paths-ignore: # 忽略仅修改文档的情况，避免不必要的构建
      - '**.md'
      - '.gitignore'
      - '.github/workflows/**'
  # 2. 允许手动触发 (Actions 页面点击 Run workflow)
  workflow_dispatch:

permissions:
  contents: write # 必须赋予写权限，否则无法创建 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 第一步：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：生成版本号 (使用日期+Commit哈希的前7位)
      # 例如：v1.0.20240121-a1b2c3d
      - name: Generate Version Tag
        id: tag
        run: |
          echo "release_tag=v$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 第三步：打包 ZIP
      # 这里我们显式指定要打包的文件，这样最安全，绝对不会包含 README 或 gitignore
      - name: Zip Module
        run: |
          zip -r Maodie-Launcher.zip META-INF maodie customize.sh module.prop service.sh uninstall.sh

      # 第四步：发布 Release 并上传附件
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }} # 使用刚才生成的版本号
          name: Maodie Launcher ${{ steps.tag.outputs.release_tag }} # Release 标题
          draft: false
          prerelease: false # 如果你想标记为预发布版本，改为 true
          files: Maodie-Launcher.zip # 上传刚才打包的文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}