name: Auto Update & Manual Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: '任务类型'
        required: true
        default: 'check_update'
        type: choice
        options:
          - check_update
          - force_release

permissions:
  contents: write

jobs:
  process-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ==========================================
      # 步骤 1 & 2: 下载更新 (逻辑保持不变)
      # ==========================================
      - name: Update MetaCubeXD
        id: webui
        if: github.event.inputs.job_type != 'force_release'
        run: |
          echo "🔍 检查 MetaCubeXD..."
          API_URL="https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest"
          LATEST_DATA=$(curl -s $API_URL)
          VERSION=$(echo "$LATEST_DATA" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ver=$VERSION" >> $GITHUB_OUTPUT
          DOWNLOAD_URL=$(echo "$LATEST_DATA" | grep 'browser_download_url' | grep 'compressed-dist.tgz' | cut -d '"' -f 4)
          echo "$DOWNLOAD_URL" | xargs wget -q -O webui.tgz
          mkdir -p temp_webui
          tar -xzf webui.tgz -C temp_webui
          TARGET_DIR="maodie/config/webui"
          mkdir -p "$TARGET_DIR"
          rm -rf "$TARGET_DIR"/*
          cp -r temp_webui/* "$TARGET_DIR"/
          rm -rf temp_webui webui.tgz

      - name: Update Mihomo Kernel
        id: kernel
        if: github.event.inputs.job_type != 'force_release'
        run: |
          echo "🔍 检查 Mihomo Kernel..."
          API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          LATEST_DATA=$(curl -s $API_URL)
          VERSION=$(echo "$LATEST_DATA" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ver=$VERSION" >> $GITHUB_OUTPUT
          DOWNLOAD_URL=$(echo "$LATEST_DATA" | grep 'browser_download_url' | grep 'android-arm64' | grep '.gz"' | cut -d '"' -f 4)
          echo "$DOWNLOAD_URL" | xargs wget -q -O Mihomo.gz
          gzip -d Mihomo.gz
          chmod +x Mihomo
          TARGET_DIR="maodie/kernel"
          mkdir -p "$TARGET_DIR"
          mv -f Mihomo "$TARGET_DIR/Mihomo"

      # ==========================================
      # 步骤 3: 核心逻辑 (含 Commit 提取功能)
      # ==========================================
      - name: Prepare Release Info & Commit
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          MODE="${{ github.event.inputs.job_type }}"
          if [ -z "$MODE" ]; then MODE="check_update"; fi
          
          SHORT_HASH=$(git rev-parse --short HEAD)
          TAG_NAME="v$(date +'%Y%m%d')-${SHORT_HASH}"
          
          # --- 核心新增：提取 Git 变更日志 ---
          echo "📜 正在生成 Commit 日志..."
          
          # 1. 尝试找到上一个 Tag
          # 2>/dev/null 屏蔽错误信息 (如果是第一次发版可能找不到 tag)
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "  未找到旧标签，列出最近 10 条记录。"
            # 格式：- 提交信息 (ShortHash)
            COMMIT_LOGS=$(git log --pretty=format:"- %s (%h)" -n 10)
          else
            echo "  对比区间: $PREV_TAG...HEAD"
            COMMIT_LOGS=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          fi
          
          # 如果日志为空 (比如刚发版完又跑了一次)，给个提示
          if [ -z "$COMMIT_LOGS" ]; then
            COMMIT_LOGS="- (No new commits)"
          fi
          
          # ------------------------------------

          SHOULD_RELEASE="false"
          COMMIT_MSG=""
          BODY=""

          # --- 分支逻辑 ---
          if [ "$MODE" == "force_release" ]; then
            echo "🚀 强制发布模式"
            SHOULD_RELEASE="true"
            COMMIT_MSG="chore: manual release $TAG_NAME"
            
            # 构建 Body：加入 Commit Logs
            BODY="📦 **手动发布**\n- 版本: $TAG_NAME\n- 基础 Commit: $SHORT_HASH\n\n### 📝 变更日志 (Changelog):\n$COMMIT_LOGS"
            
          else
            # [模式 B: 检测更新]
            git add .
            CHANGED_FILES=$(git diff --staged --name-only)
            
            if [ -z "$CHANGED_FILES" ]; then
              echo "✅ 无更新"
              echo "release=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            SHOULD_RELEASE="true"
            
            WEBUI_VER="${{ steps.webui.outputs.ver }}"
            KERNEL_VER="${{ steps.kernel.outputs.ver }}"
            IS_WEBUI_CHANGED=$(echo "$CHANGED_FILES" | grep "maodie/config/webui" || true)
            IS_KERNEL_CHANGED=$(echo "$CHANGED_FILES" | grep "maodie/kernel/Mihomo" || true)
            
            if [ -n "$IS_WEBUI_CHANGED" ] && [ -n "$IS_KERNEL_CHANGED" ]; then
              COMMIT_MSG="chore: update Kernel($KERNEL_VER) & WebUI($WEBUI_VER)"
              BODY="🔥 **双重更新**\n- 内核: $KERNEL_VER\n- 面板: $WEBUI_VER"
            elif [ -n "$IS_KERNEL_CHANGED" ]; then
              COMMIT_MSG="chore: update Kernel to $KERNEL_VER"
              BODY="🚀 **内核更新**\n- 版本: $KERNEL_VER"
            elif [ -n "$IS_WEBUI_CHANGED" ]; then
              COMMIT_MSG="chore: update WebUI to $WEBUI_VER"
              BODY="🎨 **面板更新**\n- 版本: $WEBUI_VER"
            fi
            
            # 拼接日志
            # 注意：这里的 COMMIT_LOGS 是“本次自动更新操作之前”的提交记录
            # 如果你在两次自动更新之间手动修改了脚本，这里就会显示出来
            BODY="$BODY\n\n### 📝 变更日志 (Changelog):\n$COMMIT_LOGS\n\n📌 **Release Tag**: $TAG_NAME"
          fi
          
          echo "release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

          # ============================================
          # 更新配置文件
          # ============================================
          echo "📝 更新配置文件为: $TAG_NAME"
          
          NEW_VERSION_CODE=$(date +'%Y%m%d%H%M')
          UPDATE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/update.json"
          
          # 生成 changelog.md (带上 Commit 详情)
          echo -e "$BODY" > changelog.md
          CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/changelog.md"
          
          # 修改 module.prop
          sed -i "s|^version=.*|version=$TAG_NAME|" module.prop
          sed -i "s|^versionCode=.*|versionCode=$NEW_VERSION_CODE|" module.prop
          sed -i "s|^updateJson=.*|updateJson=$UPDATE_URL|" module.prop
          
          # 生成 update.json
          echo '{
            "version": "'"$TAG_NAME"'",
            "versionCode": '"$NEW_VERSION_CODE"',
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/'"$TAG_NAME"'/Maodie-Launcher-'"$TAG_NAME"'.zip",
            "changelog": "'"$CHANGELOG_URL"'"
          }' > update.json
          
          # 提交更改
          git add module.prop update.json changelog.md
          git commit -m "$COMMIT_MSG"
          git push
          
          # 导出变量
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          {
            echo 'body<<EOF'
            echo -e "$BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      # ==========================================
      # 步骤 4: 打包并签名 (Jarsigner 版 - 最稳定)
      # ==========================================
      - name: Zip and Sign Module
        if: steps.commit.outputs.release == 'true'
        run: |
          mkdir -p maodie/run
          
          # 1. 定义文件名
          FINAL_ZIP="Maodie-Launcher-${{ steps.commit.outputs.release_tag }}.zip"
          
          # 2. 打包 (直接打成最终文件，稍后直接对它签名)
          echo "📦 正在打包..."
          zip -r "$FINAL_ZIP" META-INF maodie customize.sh module.prop service.sh uninstall.sh
          
          # 3. 生成临时密钥 (Keytool 是 Java 内置工具)
          echo "🔑 生成临时签名证书..."
          keytool -genkeypair \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Maodie, OU=Launcher, O=Android, L=Unknown, S=Unknown, C=CN" \
            -keystore debug.keystore \
            -storepass android \
            -keypass android
          
          # 4. 执行签名 (Jarsigner 是 Java 内置工具)
          # 使用 SHA1 算法以保证最大兼容性 (Magisk/KSU 认这个)
          echo "✍️ 正在签名..."
          jarsigner \
            -verbose \
            -sigalg SHA1withRSA \
            -digestalg SHA1 \
            -keystore debug.keystore \
            -storepass android \
            "$FINAL_ZIP" \
            android
          
          # 5. 验证文件
          if [ -f "$FINAL_ZIP" ]; then
            echo "✅ 签名完成: $FINAL_ZIP"
            ls -lh "$FINAL_ZIP"
            
            # 清理密钥文件
            rm debug.keystore
          else
            echo "❌ 错误：文件未生成！"
            exit 1
          fi
          
          # 6. 导出文件名供发布使用
          echo "zip_name=$FINAL_ZIP" >> $GITHUB_ENV

      # ==========================================
      # 步骤 5: 发布 Release
      # ==========================================
      - name: Create Release
        if: steps.commit.outputs.release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.commit.outputs.release_tag }}
          name: Maodie Launcher ${{ steps.commit.outputs.release_tag }}
          body: ${{ steps.commit.outputs.body }}
          draft: false
          prerelease: false
          files: ${{ env.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}