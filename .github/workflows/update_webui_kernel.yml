name: Auto Update & Manual Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: '任务类型'
        required: true
        default: 'check_update'
        type: choice
        options:
          - check_update
          - force_release

permissions:
  contents: write

jobs:
  process-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 步骤 1 & 2: 下载更新 (逻辑保持不变)
      # ==========================================
      - name: Update MetaCubeXD
        id: webui
        if: github.event.inputs.job_type != 'force_release'
        run: |
          echo "🔍 检查 MetaCubeXD..."
          API_URL="https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest"
          LATEST_DATA=$(curl -s $API_URL)
          VERSION=$(echo "$LATEST_DATA" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ver=$VERSION" >> $GITHUB_OUTPUT
          DOWNLOAD_URL=$(echo "$LATEST_DATA" | grep 'browser_download_url' | grep 'compressed-dist.tgz' | cut -d '"' -f 4)
          echo "$DOWNLOAD_URL" | xargs wget -q -O webui.tgz
          mkdir -p temp_webui
          tar -xzf webui.tgz -C temp_webui
          TARGET_DIR="maodie/config/webui"
          mkdir -p "$TARGET_DIR"
          rm -rf "$TARGET_DIR"/*
          cp -r temp_webui/* "$TARGET_DIR"/
          rm -rf temp_webui webui.tgz

      - name: Update Mihomo Kernel
        id: kernel
        if: github.event.inputs.job_type != 'force_release'
        run: |
          echo "🔍 检查 Mihomo Kernel..."
          API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          LATEST_DATA=$(curl -s $API_URL)
          VERSION=$(echo "$LATEST_DATA" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ver=$VERSION" >> $GITHUB_OUTPUT
          DOWNLOAD_URL=$(echo "$LATEST_DATA" | grep 'browser_download_url' | grep 'android-arm64' | grep '.gz"' | cut -d '"' -f 4)
          echo "$DOWNLOAD_URL" | xargs wget -q -O Mihomo.gz
          gzip -d Mihomo.gz
          chmod +x Mihomo
          TARGET_DIR="maodie/kernel"
          mkdir -p "$TARGET_DIR"
          mv -f Mihomo "$TARGET_DIR/Mihomo"

      # ==========================================
      # 步骤 3: 核心逻辑 (统一版本号格式)
      # ==========================================
      - name: Prepare Release Info & Commit
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          MODE="${{ github.event.inputs.job_type }}"
          if [ -z "$MODE" ]; then MODE="check_update"; fi
          
          # --- 生成统一的 TAG 格式 ---
          # 格式: v20260121-0f5a19e
          # 使用 HEAD 的 Hash，确保每次基于最新代码状态生成
          SHORT_HASH=$(git rev-parse --short HEAD)
          TAG_NAME="v$(date +'%Y%m%d')-${SHORT_HASH}"
          
          # 初始化变量
          SHOULD_RELEASE="false"
          COMMIT_MSG=""
          BODY=""

          # --- 分支逻辑 ---
          if [ "$MODE" == "force_release" ]; then
            # [模式 A: 强制发布]
            echo "🚀 强制发布模式"
            SHOULD_RELEASE="true"
            COMMIT_MSG="chore: manual release $TAG_NAME"
            BODY="📦 **手动发布**\n- 版本: $TAG_NAME\n- 基础 Commit: $SHORT_HASH"
            
          else
            # [模式 B: 检测更新]
            git add .
            CHANGED_FILES=$(git diff --staged --name-only)
            
            if [ -z "$CHANGED_FILES" ]; then
              echo "✅ 无更新"
              echo "release=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            SHOULD_RELEASE="true"
            
            # 获取上游版本号用于写日志
            WEBUI_VER="${{ steps.webui.outputs.ver }}"
            KERNEL_VER="${{ steps.kernel.outputs.ver }}"
            IS_WEBUI_CHANGED=$(echo "$CHANGED_FILES" | grep "maodie/config/webui" || true)
            IS_KERNEL_CHANGED=$(echo "$CHANGED_FILES" | grep "maodie/kernel/Mihomo" || true)
            
            # 这里的逻辑只影响 Commit Message 和 Release Body，不影响 Tag 名字了
            if [ -n "$IS_WEBUI_CHANGED" ] && [ -n "$IS_KERNEL_CHANGED" ]; then
              COMMIT_MSG="chore: update Kernel($KERNEL_VER) & WebUI($WEBUI_VER)"
              BODY="🔥 **双重更新**\n- 内核: $KERNEL_VER\n- 面板: $WEBUI_VER"
            elif [ -n "$IS_KERNEL_CHANGED" ]; then
              COMMIT_MSG="chore: update Kernel to $KERNEL_VER"
              BODY="🚀 **内核更新**\n- 版本: $KERNEL_VER"
            elif [ -n "$IS_WEBUI_CHANGED" ]; then
              COMMIT_MSG="chore: update WebUI to $WEBUI_VER"
              BODY="🎨 **面板更新**\n- 版本: $WEBUI_VER"
            fi
            
            # 把 Tag 加到 Body 里方便查看
            BODY="$BODY\n\n📌 **Release Tag**: $TAG_NAME"
          fi
          
          echo "release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

          # ============================================
          # 更新配置文件 (module.prop / update.json)
          # ============================================
          echo "📝 更新配置文件为: $TAG_NAME"
          
          NEW_VERSION_CODE=$(date +'%Y%m%d')
          UPDATE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/update.json"
          
          # 修改 module.prop
          sed -i "s|^version=.*|version=$TAG_NAME|" module.prop
          sed -i "s|^versionCode=.*|versionCode=$NEW_VERSION_CODE|" module.prop
          sed -i "s|^updateUrl=.*|updateUrl=$UPDATE_URL|" module.prop
          
          # 生成 update.json
          echo '{
            "version": "'"$TAG_NAME"'",
            "versionCode": '"$NEW_VERSION_CODE"',
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/'"$TAG_NAME"'/Maodie-Launcher-'"$TAG_NAME"'.zip",
            "changelog": "https://github.com/${{ github.repository }}/releases/tag/'"$TAG_NAME"'"
          }' > update.json
          
          # 提交更改
          git add module.prop update.json
          git commit -m "$COMMIT_MSG"
          git push
          
          # 导出变量
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          {
            echo 'body<<EOF'
            echo -e "$BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      # ==========================================
      # 步骤 4: 打包并签名 (扩展名伪装版)
      # ==========================================
      # ==========================================
      # 步骤 4: 打包并签名 (SignApk 版)
      # ==========================================
      - name: Zip and Sign Module
        if: steps.commit.outputs.release == 'true'
        run: |
          mkdir -p maodie/run
          
          # 1. 定义文件名
          UNSIGNED_ZIP="unsigned.zip"
          FINAL_ZIP="Maodie-Launcher-${{ steps.commit.outputs.release_tag }}.zip"
          
          # 2. 打包 (先打成 unsigned.zip)
          echo "📦 正在打包..."
          zip -r "$UNSIGNED_ZIP" META-INF maodie customize.sh module.prop service.sh uninstall.sh
          
          # 3. 下载签名工具 (signapk + 测试密钥)
          # 使用传统的 signapk，它专门用于给 update.zip 或 Magisk 模块签名，不检查 AndroidManifest
          echo "📥 下载 signapk 工具..."
          wget -q https://raw.githubusercontent.com/tehcneko/SignApk-jar-and-pem-pk8-files/master/signapk.jar
          wget -q https://raw.githubusercontent.com/tehcneko/SignApk-jar-and-pem-pk8-files/master/testkey.x509.pem
          wget -q https://raw.githubusercontent.com/tehcneko/SignApk-jar-and-pem-pk8-files/master/testkey.pk8
          
          # 4. 执行签名
          # 语法: java -jar signapk.jar [公钥] [私钥] [输入文件] [输出文件]
          echo "✍️ 正在签名..."
          java -jar signapk.jar testkey.x509.pem testkey.pk8 "$UNSIGNED_ZIP" "$FINAL_ZIP"
          
          # 5. 检查结果
          if [ -f "$FINAL_ZIP" ]; then
            echo "✅ 签名完成: $FINAL_ZIP"
            ls -lh "$FINAL_ZIP"
            
            # 清理临时文件
            rm -f "$UNSIGNED_ZIP" signapk.jar testkey.x509.pem testkey.pk8
          else
            echo "❌ 错误：签名失败，输出文件未生成！"
            exit 1
          fi
          
          # 6. 导出文件名供发布使用
          echo "zip_name=$FINAL_ZIP" >> $GITHUB_ENV

      # ==========================================
      # 步骤 5: 发布 Release
      # ==========================================
      - name: Create Release
        if: steps.commit.outputs.release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.commit.outputs.release_tag }}
          name: Maodie Launcher ${{ steps.commit.outputs.release_tag }}
          body: ${{ steps.commit.outputs.body }}
          draft: false
          prerelease: false
          files: ${{ env.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}